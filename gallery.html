					<span class="navbar-toggler-icon">
					</span>
				</button>
				<div class="collapse navbar-collapse" id="mainNav">
					<ul class="navbar-nav ms-auto nav-list">
						<li class="nav-item">
							<a class="nav-link" href="index.html">
								Home
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="movies.html">

						<li class="nav-item">
							<a class="nav-link" href="ratings.html">

							</a>

				</div>
			</div>
		</nav>
	</header>
	<main>
		<section class="page-hero">
			<div class="container">
				<p class="eyebrow">GALLERY</p>
				<h1>Posters from the <span>collection.</span></h1>
				<p>Click any poster to enlarge it, then use the arrows or your keyboard to browse.</p>
			</div>
		</section>
		<section class="section-padding">
			<div class="container">
				<div class="row g-4" id="galleryGrid">
					<div class="col-6 col-md-4 col-lg-3">
						<figure class="gallery-item" data-index="0" data-full="images/endgame.jpg" data-caption="Avengers: Endgame &middot; Action" tabindex="0" role="button" aria-label="Open Avengers: Endgame">
							<img src="images/endgame.jpg" alt="Avengers: Endgame poster" loading="lazy" />
							<figcaption>Avengers: Endgame</figcaption>
						</figure>
					</div>
					<div class="col-6 col-md-4 col-lg-3">
						<figure class="gallery-item" data-index="1" data-full="images/LORDOFRINGS.jpg" data-caption="The Lord of the Rings: The Return of the King &middot; Fantasy" tabindex="0" role="button" aria-label="Open The Lord of the Rings: The Return of the King">
							<img src="images/LORDOFRINGS.jpg" alt="The Lord of the Rings: The Return of the King poster" loading="lazy" />
							<figcaption>The Lord of the Rings: The Return of the King</figcaption>
						</figure>
					</div>
					<div class="col-6 col-md-4 col-lg-3">
						<figure class="gallery-item" data-index="2" data-full="images/lalaland.jpg" data-caption="La La Land &middot; Drama" tabindex="0" role="button" aria-label="Open La La Land">
							<img src="images/lalaland.jpg" alt="La La Land poster" loading="lazy" />
							<figcaption>La La Land</figcaption>
						</figure>
					</div>
					<div class="col-6 col-md-4 col-lg-3">
						<figure class="gallery-item" data-index="3" data-full="images/7q.jpg" data-caption="7 Qaraqshy &middot; History" tabindex="0" role="button" aria-label="Open 7 Qaraqshy">
							<img src="images/7q.jpg" alt="7 Qaraqshy poster" loading="lazy" />
							<figcaption>7 Qaraqshy</figcaption>
						</figure>
					</div>
					<div class="col-6 col-md-4 col-lg-3">
						<figure class="gallery-item" data-index="4" data-full="images/lovely-runner.jpeg" data-caption="Lovely Runner &middot; Romance" tabindex="0" role="button" aria-label="Open Lovely Runner">
							<img src="images/lovely-runner.jpeg" alt="Lovely Runner poster" loading="lazy" />
							<figcaption>Lovely Runner</figcaption>
						</figure>
					</div>
					<div class="col-6 col-md-4 col-lg-3">
						<figure class="gallery-item" data-index="5" data-full="images/PARASITE.jpg" data-caption="Parasite &middot; Thriller" tabindex="0" role="button" aria-label="Open Parasite">
							<img src="images/PARASITE.jpg" alt="Parasite poster" loading="lazy" />
							<figcaption>Parasite</figcaption>
						</figure>
					</div>
					<div class="col-6 col-md-4 col-lg-3">
						<figure class="gallery-item" data-index="6" data-full="images/RESIDENTEVIL.jpg" data-caption="Resident Evil &middot; Horror" tabindex="0" role="button" aria-label="Open Resident Evil">
							<img src="images/RESIDENTEVIL.jpg" alt="Resident Evil poster" loading="lazy" />
							<figcaption>Resident Evil</figcaption>
						</figure>
					</div>
					<div class="col-6 col-md-4 col-lg-3">
						<figure class="gallery-item" data-index="7" data-full="images/PROJECTHAILMARY.jpg" data-caption="Project Hail Mary &middot; Sci-Fi" tabindex="0" role="button" aria-label="Open Project Hail Mary">
							<img src="images/PROJECTHAILMARY.jpg" alt="Project Hail Mary poster" loading="lazy" />
							<figcaption>Project Hail Mary</figcaption>
						</figure>
					</div>
				</div>
			</div>
		</section>
		<div id="lightbox" aria-hidden="true">
			<button type="button" id="lbClose" aria-label="Close">&times;</button>
			<button type="button" class="lb-nav" id="lbPrev" aria-label="Previous image">&#10094;</button>
			<figure class="lb-figure">
				<img id="lbImage" src="" alt="" />
				<figcaption id="lbCaption"></figcaption>
			</figure>
			<button type="button" class="lb-nav" id="lbNext" aria-label="Next image">&#10095;</button>
		</div>
	
	</main>
